; Upload limits for the portal.
;
; The control panel accepts files of up to 50 MB, which the server has to allow
; as well or the request is refused before the application sees it. Hosting
; that runs PHP as FastCGI or FPM, as a cPanel account normally does, reads
; this file; Apache with mod_php reads the matching lines in .htaccess instead.
;
; Where neither applies, raise the same four values in the hosting control
; panel: on cPanel that is MultiPHP INI Editor.

upload_max_filesize = 50M
post_max_size = 52M
max_file_uploads = 30
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
